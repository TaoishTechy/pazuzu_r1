name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository (full history for commit hash in report)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit and integration tests (fixed seeds)
        run: python -m unittest discover -s tests -v

      - name: Artifact integrity (full SHA-256, placeholder rejection)
        run: python src/verify_all.py --check-hashes --full-sha256 --seed-override strict

      - name: Full suite → suite_report.json
        run: python src/verify_all.py --full --output logs/suite_report.json

      - name: Upload suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-report
          path: logs/suite_report.json
